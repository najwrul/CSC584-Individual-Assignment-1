<html>
    <head>
        <meta charset="UTF-8">
        <title>User Information</title>
        <style>
            body {
                font-family: 'Trebuchet MS', sans-serif;
                background-color: #b2ac88;
            }
        </style>
    </head>
    <body>
        <h1>📝 Add User Information 📝</h1>
        <form action="AddUserInformation" method="post">
            🔠 Name: <input type="text" name="name" required><br><br>
            🆔 Student ID: <input type="text" name="studentID" required><br><br>
            📚 Program: <input type="text" name="program" required><br><br>
            ✉️ Email: <input type="text" name="email" required><br><br>
            🏓 Hobbies: <input type="text" name="hobbies" required><br><br>
            💬 Short self-introduction: <input type="text" name="selfIntroduction" required><br><br>
            <input type="submit" value="Add Information">
        </form>
    </body>
</html>
